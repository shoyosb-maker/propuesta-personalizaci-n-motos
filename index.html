<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="description" content="Configurador 3D web de la Ducati Panigale V4 SP — modelo 360 con personalización de color por pieza." />
    <title>Personaliza a tu gusto · Configurador 3D</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="renderCanvas" touch-action="none"></canvas>

    <header class="brand">
      <span class="eyebrow">Ducati Panigale V4 SP · Configurador 3D</span>
      <h1>Personaliza <span>a tu gusto</span></h1>
      <p class="sub">Gira la moto, elige una pieza y cámbiale el acabado en tiempo real.</p>
      <ul class="specs">
        <li><b id="statTris">—</b> triángulos</li>
        <li><b id="statParts">—</b> materiales</li>
        <li><b id="statFps">—</b> fps</li>
      </ul>
    </header>

    <aside class="panel" id="panel">
      <button class="sheet-grip" id="sheetGrip" type="button" aria-expanded="false"
              aria-label="Mostrar u ocultar los colores">
        <span class="grip-float">
          <svg class="grip-arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 15 6-6 6 6" />
          </svg>
        </span>
      </button>

      <div class="panel-head">
        <span class="eyebrow">Pieza del modelo</span>
        <div class="dropdown" id="dropdown">
          <button
            class="dropdown-trigger"
            id="ddTrigger"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="select-dot" id="selectDot"></span>
            <span class="dropdown-value" id="ddLabel">Cargando…</span>
            <svg class="dropdown-caret" viewBox="0 0 12 8" aria-hidden="true">
              <path
                d="M1 1.5 6 6.5l5-5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <ul class="dropdown-menu" id="ddMenu" role="listbox" aria-label="Piezas del modelo"></ul>
        </div>
        <p id="partHint">Selecciona una pieza en el modelo o en la lista.</p>
      </div>

      <div class="divider"></div>

      <span class="eyebrow">Color</span>
      <div class="palette" id="palette" aria-label="Colores disponibles"></div>

      <div class="actions">
        <label class="custom" for="colorInput">
          <span class="custom-label">Color personalizado</span>
          <span class="custom-value" id="colorValue">#C8102E</span>
          <input type="color" id="colorInput" value="#c8102e" />
        </label>

        <button class="ghost" id="resetPart" type="button">
          <span class="long">Restablecer esta pieza</span>
          <span class="short">Restablecer</span>
        </button>
      </div>
    </aside>

    <div class="toolbar">
      <button class="chip is-on" id="btnRotate" type="button" title="Rotación automática">⟳ 360°</button>
      <button class="chip" id="btnWire" type="button" title="Ver malla de polígonos">Malla</button>
      <button class="chip" id="btnScreenshot" type="button" title="Descargar captura PNG">Captura</button>
      <button class="chip" id="btnReset" type="button" title="Volver a los colores de fábrica">Reset</button>
    </div>

    <div class="loader" id="loader">
      <div class="loader-inner">
        <div class="ring"></div>
        <p id="loaderText">Cargando modelo…</p>
        <div class="bar"><i id="loaderBar"></i></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
